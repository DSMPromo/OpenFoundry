# edge-gateway-service — defaults shipped inside the container image.
# Override per-environment via CONFIG_FILE or OF_* env vars.

service:
  name: edge-gateway-service
  version: 0.1.0

server:
  host: "0.0.0.0"
  port: 8080
  shutdown_timeout: 15s

jwt:
  # In production the secret comes from a Kubernetes Secret mounted
  # as OF_JWT__SECRET, never from this file.
  secret: ""
  issuer: ""
  audience: ""

telemetry:
  otlp_endpoint: "localhost:4317"
  log_format: "plain"

# Optional integrations — empty values disable each integration cleanly.
nats_url: ""
redis_url: ""

cors_origins: []

rate_limit:
  anonymous_requests_per_minute: 120
  burst_size: 30
  bucket_ttl_secs: 300
  redis_key_prefix: "openfoundry:ratelimit"

# Upstream URLs default to localhost ports for dev / docker-compose.
# Override per field in production via Helm values.
upstream:
  identity_federation_service_url: "http://identity-federation-service:50112"
  authorization_policy_service_url: "http://authorization-policy-service:50093"
  # ADR-0030 B14: security-governance-service was absorbed into
  # authorization-policy-service. Alias the upstream key so the gateway
  # keeps routing `/api/v1/security-governance` and audit-governance
  # paths to the same binary that hosts the policy engine.
  security_governance_service_url: "http://authorization-policy-service:50093"
  tenancy_organizations_service_url: "http://tenancy-organizations-service:50113"
  connector_management_service_url: "http://connector-management-service:50088"
  ingestion_replication_service_url: "http://ingestion-replication-service:50090"
  dataset_versioning_service_url: "http://dataset-versioning-service:50078"
  iceberg_catalog_service_url: "http://iceberg-catalog-service:50118"
  query_service_url: "http://sql-bi-gateway-service:50133"
  pipeline_build_service_url: "http://pipeline-build-service:50081"
  lineage_service_url: "http://lineage-service:50083"
  ontology_definition_service_url: "http://ontology-definition-service:50103"
  object_database_service_url: "http://object-database-service:50104"
  ontology_query_service_url: "http://ontology-query-service:50105"
  ontology_actions_service_url: "http://ontology-actions-service:50106"
  workflow_service_url: "http://workflow-automation-service:50137"
  notebook_service_url: "http://notebook-runtime-service:50134"
  notification_service_url: "http://notification-alerting-service:50114"
  app_builder_service_url: "http://application-composition-service:50140"
  application_composition_service_url: "http://application-composition-service:50140"
  ml_service_url: "http://model-catalog-service:50085"
  model_catalog_service_url: "http://model-catalog-service:50085"
  model_deployment_service_url: "http://model-deployment-service:50086"
  ai_service_url: "http://agent-runtime-service:50127"
  llm_catalog_service_url: "http://llm-catalog-service:50095"
  retrieval_context_service_url: "http://retrieval-context-service:50098"
  ai_evaluation_service_url: "http://ai-evaluation-service:50075"
  geospatial_intelligence_service_url: "http://ontology-exploratory-analysis-service:50131"
  audit_compliance_service_url: "http://audit-compliance-service:50115"
  telemetry_governance_service_url: "http://telemetry-governance-service:50153"
  federation_product_exchange_service_url: "http://federation-product-exchange-service:50120"
  network_boundary_service_url: "http://network-boundary-service:50119"
  # Other upstream URLs use code-side defaults from internal/config/config.go.
